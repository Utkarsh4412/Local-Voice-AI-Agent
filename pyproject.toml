[project]
name = "local-voice-agent"
version = "0.1.0"
description = "Real-time local voice chat agent: Moonshine STT → Ollama LLM → Kokoro TTS, streamed via FastRTC."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastrtc[stt]>=0.0.19",
    "kokoro-onnx>=0.4.7",
    "loguru>=0.7.3",
    "ollama>=0.4.7",
    "pyyaml>=6.0",
]
