[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaak"
version = "0.1.0-dev"
description = "Local-first multilingual real-time voice agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastrtc[stt]>=0.0.19",
    "av==14.2.0",         # prebuilt cp312-win_amd64 wheel; 14.4.0 lacks one
    "gradio>=4.0,<5.40",  # fastrtc.webrtc imports gradio.wasm_utils, removed in 5.40
    "kokoro-onnx>=0.4.7",
    "loguru>=0.7.3",
    "ollama>=0.4.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
vaak = "vaak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vaak"]


